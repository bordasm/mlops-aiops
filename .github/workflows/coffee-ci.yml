name: Coffee application CI

on:
  push:
    branches: [cloud_run]
  pull_request:
    branches: [cloud_run]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffee-ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: coffeePricePredictor

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            coffeePricePredictor/tests/requirements.txt
            coffeePricePredictor/docker/requirements.txt
            coffeePricePredictor/api_mlflow/requirements.txt
            coffeePricePredictor/dashboard/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Check PEP 8 for service and dashboard code
        run: |
          python -m pycodestyle \
            api_mlflow/coffee_mlflow_api/registry.py \
            api_mlflow/coffee_mlflow_api/serving.py \
            api_mlflow/coffee_mlflow_api/training.py \
            api_mlflow/coffee_mlflow_api/service.py \
            api_mlflow/coffee_mlflow_api/jobs.py \
            api_mlflow/coffee_mlflow_api/training_app.py \
            api_mlflow/coffee_mlflow_api/inference_app.py \
            api_mlflow/coffee_mlflow_api/worker.py \
            api_mlflow/coffee_mlflow_api/job_runner.py \
            dashboard airflow/dags \
            productionReadyCode/src/coffee_price_predictor/metrics.py \
            productionReadyCode/src/coffee_price_predictor/modeling.py \
            tests/test_training_jobs.py tests/test_airflow_training.py \
            tests/test_dashboard.py tests/test_api_container.py \
            tests/microservice_smoke.py
      - name: Run application tests
        env:
          MLFLOW_DISABLE_TELEMETRY: "true"
          MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
          DO_NOT_TRACK: "1"
        run: python -m unittest discover -s tests -v
      - name: Validate Compose configuration
        env:
          MLFLOW_DB_PASSWORD: ci-placeholder
        run: docker compose config --quiet

  image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [inference, training, dashboard, mlflow]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build ${{ matrix.target }} image
        run: docker build --file docker/Dockerfile --target "${{ matrix.target }}" --tag "coffee-ci-${{ matrix.target }}" .

  airflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Airflow image
        run: docker build --tag coffee-ci-airflow airflow
      - name: Run native DAG tests
        run: docker run --rm coffee-ci-airflow python -m unittest discover -s /opt/airflow/tests -v

  publish-images:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/cloud_run'
    needs: [python-tests, image-build, airflow-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloud-run-publication
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inference
            target: inference
          - name: training
            target: training
          - name: dashboard
            target: dashboard
          - name: mlflow
            target: mlflow
          - name: airflow
            target: airflow
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
      IMAGE_COMPONENT: ${{ matrix.name }}
      IMAGE_TARGET: ${{ matrix.target }}
      IMAGE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate publication configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION SERVICE_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required."
              exit 1
            fi
          done
          if [[ ! "$GCP_REGION" =~ ^[a-z0-9]+(-[a-z0-9]+)+$ ]]; then
            echo "::error::GCP_REGION must be a valid lowercase region."
            exit 1
          fi
          if [[ ! "$SERVICE_NAME" =~ ^[a-z][a-z0-9-]*[a-z0-9]$ ]]; then
            echo "::error::SERVICE_NAME must be a lowercase image prefix."
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Verify repository and configure Docker
        shell: bash
        run: |
          set -euo pipefail
          format="$(gcloud artifacts repositories describe mlsecops \
            --project="$GCP_PROJECT_ID" --location="$GCP_REGION" \
            --format='value(format)')"
          if [[ "$format" != DOCKER ]]; then
            echo "::error::The mlsecops repository must use Docker format."
            exit 1
          fi
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - name: Build and publish image
        shell: bash
        run: |
          set -euo pipefail
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/mlsecops/$SERVICE_NAME-$IMAGE_COMPONENT:$IMAGE_SHA"
          if [[ "$IMAGE_TARGET" == airflow ]]; then
            docker build --tag "$image" airflow
          else
            docker build --file docker/Dockerfile --target "$IMAGE_TARGET" \
              --tag "$image" .
          fi
          docker push "$image"
